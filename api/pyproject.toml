[project]
name = "infinite-bookshelf-api"
version = "0.6.0.dev0"
description = "Infinite Bookshelf API: a stateless engine that turns a topic into a book, streamed live"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.4",
    "openai>=1.26.0",
    "markdown>=3.6",
    "weasyprint>=62.3",
    "fpdf2>=2.8.0",
    "nh3>=0.2.17",
    "fastapi-offline>=1.7.7",
]

[project.scripts]
infinite-bookshelf-api = "infinite_bookshelf.server.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infinite_bookshelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
