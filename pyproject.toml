[project]
name = "infinite-bookshelf"
version = "0.4.0"
description = "Generate entire books in seconds using AI models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.50.0",
    "openai>=1.26.0",
    "python-dotenv>=1.0.1",
    "markdown>=3.6",
    "weasyprint>=62.3",
    "fpdf2>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
