version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (root lockfile)
    directory: /
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
