# Self-hosting Infinite Bookshelf → http://localhost:9752
#   docker compose up -d                          most hosts, including Docker Desktop
#   docker compose up -d infinite-bookshelf-host  GitHub Codespaces (uses the host's network and DNS)

x-app: &app
  image: ghcr.io/sasivarnasarma/infinite-bookshelf:latest
  build: .
  environment:
    # Allows local model servers (Ollama, LM Studio). For a public instance set "false" and
    # add a rate limit, e.g. IB_RATE_LIMIT_PER_MINUTE: "30"
    IB_ALLOW_PRIVATE_ENDPOINTS: 'true'
  restart: unless-stopped

services:
  infinite-bookshelf:
    <<: *app
    ports:
      - '9752:9752'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  infinite-bookshelf-host:
    <<: *app
    profiles: [host]
    network_mode: host
