<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Bookshelf · Turn one idea into a whole book</title>
    <meta name="description" content="Turn a topic into a complete, structured book. Bring your own AI model and watch every chapter being written live." />
    <meta name="keywords" content="AI book writer, book generator, write a book with AI, LLM, OpenAI, Claude, Gemini, Ollama, open source, self-hosted" />
    <meta name="author" content="Sasivarnasarma" />
    <meta name="application-name" content="Infinite Bookshelf" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)" />
    <!-- Made absolute from VITE_SITE_URL at build time, or by the API when it serves the page.
         vite-ignore: Vite would otherwise try to bundle "/" as a file -->
    <link rel="canonical" href="/" vite-ignore />

    <!-- Icons, and installing as an app -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bookshelf" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews: Open Graph (Facebook, LinkedIn, WhatsApp, Slack, Discord…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Infinite Bookshelf" />
    <meta property="og:title" content="Infinite Bookshelf · Turn one idea into a whole book" />
    <meta
      property="og:description"
      content="Turn a topic into a complete, structured book. Bring your own AI model and watch every chapter being written live."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Infinite Bookshelf: turn one idea into a whole book" />
    <meta property="og:locale" content="en_US" />

    <!-- Link previews on X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Infinite Bookshelf · Turn one idea into a whole book" />
    <meta
      name="twitter:description"
      content="Turn a topic into a complete, structured book. Bring your own AI model and watch every chapter being written live."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Infinite Bookshelf: turn one idea into a whole book" />

    <!-- Search engines: what this page is. A data block, not a script, so the CSP allows it -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Infinite Bookshelf",
        "description": "Turn a topic into a complete, structured book, written live by the AI model of your choice.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/Sasivarnasarma/infinite-bookshelf",
        "author": { "@type": "Person", "name": "Sasivarnasarma", "url": "https://github.com/Sasivarnasarma" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Classic blocking script: applies the saved theme before first paint (no flash) -->
    <script src="/theme-init.js"></script>
    <!-- Where the API is (empty: this server); editable after deploying -->
    <script src="/config.js"></script>
  </head>
  <body>
    <noscript>Infinite Bookshelf needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
